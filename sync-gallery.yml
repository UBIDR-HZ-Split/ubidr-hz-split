name: Sync CMS albums with uploaded GitHub photos

on:
  push:
    branches: [main]
    paths:
      - "uploads/galerija/**"
      - "content/gallery.json"
      - "scripts/sync-gallery.mjs"
      - ".github/workflows/sync-gallery.yml"

permissions:
  contents: write

jobs:
  sync-gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Merge uploaded photos into CMS albums
        run: node scripts/sync-gallery.mjs
      - name: Commit updated gallery JSON
        run: |
          if git diff --quiet -- content/gallery.json; then
            echo "Gallery is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/gallery.json
          git commit -m "Sync gallery photos from uploads folders"
          git push
