name: Build gallery from uploaded folders

on:
  push:
    branches: [main]
    paths:
      - "uploads/galerija/**"
      - "scripts/build-gallery.mjs"
      - ".github/workflows/build-gallery.yml"

permissions:
  contents: write

jobs:
  build-gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build content/gallery.json
        run: node scripts/build-gallery.mjs
      - name: Commit generated gallery
        run: |
          if git diff --quiet -- content/gallery.json; then
            echo "Gallery JSON is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/gallery.json
          git commit -m "Update gallery from uploaded photo folders"
          git push
